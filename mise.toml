min_version = "2026.4.8"

[settings]
install_before = "1d"

[tools]
# Use the aqua backend (GitHub Releases). The npm-published native
# binary tarball (@biomejs/cli-* ~30MB) fetches unreliably on CI.
biome = "2.4.13"
bun = "1.3.13"
node = "24.15.0"
"npm:@endevco/aube" = "1.5.0"

[tools."npm:pnpm-override-prune"]
version = "0.0.6"
install_before = "0d"

[task_config]
includes = [
  "git::https://github.com/iwamot/mise-tasks.git//.mise/tasks?ref=v1.6.0",
]
