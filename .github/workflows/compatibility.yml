name: Compatibility

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions: {}

jobs:
  compatibility:
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-${{ github.job }}-${{ github.event.pull_request.number || github.sha }}
      cancel-in-progress: true
    uses: iwamot/workflows/.github/workflows/compatibility-node.yml@ba5efb9911ae0952fe1dee4d5c811fd85f345d52 # v8.12.0
    with:
      # The floor is the oldest Node release upstream still supports, and
      # `engines.node` in package.json carries the same number: that field is
      # what promises the package installs there. Both move when a release
      # leaves support.
      node-versions: '["22","24"]'
