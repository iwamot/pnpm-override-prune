name: Compatibility

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions: {}

jobs:
  compatibility:
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-${{ github.job }}-${{ github.event.pull_request.number || github.sha }}
      cancel-in-progress: true
    uses: iwamot/workflows/.github/workflows/compatibility-node.yml@e30904fbba60ee0a2dde540df2403a90e59e3a5e # v8.17.0
    with:
      # The floor is the oldest Node release upstream still supports, and
      # `engines.node` in package.json carries the same number: that field is
      # what promises the package installs there. Both move when a release
      # leaves support.
      node-versions: '["22","24"]'
