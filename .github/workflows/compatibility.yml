name: Compatibility

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions: {}

jobs:
  compatibility:
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-${{ github.job }}-${{ github.event.pull_request.number || github.sha }}
      cancel-in-progress: true
    uses: iwamot/workflows/.github/workflows/compatibility-node.yml@7b091fa5fb18e6dc84145fa54fd45ff94e139cd0 # v8.18.0
    with:
      # The floor is the oldest Node release upstream still supports, and
      # `engines.node` in package.json carries the same number: that field is
      # what promises the package installs there. Both move when a release
      # leaves support.
      node-versions: '["22","24"]'
