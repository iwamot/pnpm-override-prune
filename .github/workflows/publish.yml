name: Publish

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: iwamot/actions/npm-publish@792bb6f7b66b5d046aa285d39303a0aa7b10f822 # v0.5.0
