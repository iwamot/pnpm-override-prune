name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.2.3)'
        required: true
        type: string

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    environment: production
    permissions:
      contents: write  # to manage the GitHub Release lifecycle
      checks: read  # for required CI checks when the shared action waits before tagging
      statuses: read  # for required legacy commit statuses
      id-token: write  # for npm Trusted Publishing OIDC
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            api.osv.dev:443
            fulcio.sigstore.dev:443
            github.com:443
            mise-versions.jdx.dev:443
            mise.jdx.dev:443
            nodejs.org:443
            npm.jsr.io:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443
            rekor.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443

      - uses: iwamot/actions/release-tag@822d705bcb3db0cb3c1f969001c6de5eda9660f1 # v2.13.3
        id: release-tag
        with:
          tag: ${{ inputs.tag || '' }}

      - uses: iwamot/actions/release-draft@822d705bcb3db0cb3c1f969001c6de5eda9660f1 # v2.13.3
        with:
          tag: ${{ steps.release-tag.outputs.tag }}
      - uses: iwamot/actions/npm-publish@822d705bcb3db0cb3c1f969001c6de5eda9660f1 # v2.13.3
        with:
          tag: ${{ steps.release-tag.outputs.tag }}
      - uses: iwamot/actions/release-publish@822d705bcb3db0cb3c1f969001c6de5eda9660f1 # v2.13.3
        with:
          tag: ${{ steps.release-tag.outputs.tag }}
