name: Release

on:
  push:
    tags: ['v*.*.*']

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    environment: production
    permissions:
      contents: write  # to manage the GitHub Release lifecycle
      id-token: write  # for npm Trusted Publishing OIDC
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            api.osv.dev:443
            fulcio.sigstore.dev:443
            github.com:443
            mise-versions.jdx.dev:443
            mise.jdx.dev:443
            nodejs.org:443
            npm.jsr.io:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443
            rekor.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443

      - uses: iwamot/actions/release-draft@065163b337e28a1bb41683e62e1e481cb15b6493 # v2.10.0
      - uses: iwamot/actions/npm-publish@065163b337e28a1bb41683e62e1e481cb15b6493 # v2.10.0
      - uses: iwamot/actions/release-publish@065163b337e28a1bb41683e62e1e481cb15b6493 # v2.10.0
