name: Release

on:
  push:
    tags: ['v*.*.*']

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    permissions:
      contents: write  # to manage the GitHub Release lifecycle
      id-token: write  # for npm Trusted Publishing OIDC
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: iwamot/actions/release-draft@c2e62039e48411060c6e95096dfc125426c78905 # v2.0.6
      - uses: iwamot/actions/npm-publish@c2e62039e48411060c6e95096dfc125426c78905 # v2.0.6
      - uses: iwamot/actions/release-publish@c2e62039e48411060c6e95096dfc125426c78905 # v2.0.6
