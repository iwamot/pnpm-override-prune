name: Release

on:
  push:
    tags: ['v*.*.*']

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    permissions:
      contents: write  # to manage the GitHub Release lifecycle
      id-token: write  # for npm Trusted Publishing OIDC
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - uses: iwamot/actions/release-draft@e18f6a98fcbf9d5b24440bee1828bb65cafe3747 # v2.0.4
      - uses: iwamot/actions/npm-publish@e18f6a98fcbf9d5b24440bee1828bb65cafe3747 # v2.0.4
      - uses: iwamot/actions/release-publish@e18f6a98fcbf9d5b24440bee1828bb65cafe3747 # v2.0.4
